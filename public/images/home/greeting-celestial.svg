<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Luna celestial horizon</title>
  <desc id="desc">A calm violet and gold sky over layered moonlit mountains.</desc>
